[project]
name = "sentiment-analysis-suite"
version = "1.0.0"
description = "Multi-source sentiment analysis with emotion detection, aspect-based analysis, and batch processing for social media and reviews."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "transformers>=4.40",
    "torch>=2.2",
    "tokenizers>=0.15",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
